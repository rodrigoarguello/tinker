# tinker.onda.study — sitio PUBLICO salvo /admin.
#
# La decision que ordena este archivo: la gente de una fiesta no se loguea.
# El QR, participante.html, pantalla.html y toda la API de pedidos son
# abiertos a proposito. Lo unico detras de Authelia es la administracion:
# crear eventos, ponerlos en vivo y cerrarlos.
#
# ⚠ COPIAR A /srv/01-infra/nginx/conf.d/ RECIEN CUANDO EXISTA EL CERTIFICADO.
# Nginx no arranca si un .conf apunta a un certificado que no existe, y eso
# deja TODOS los sitios del servidor fuera de servicio, no solo este.

server {
    listen      80;
    listen      [::]:80;
    server_name tinker.onda.study;
    # El desafio de ACME va primero: si lo tapa la redireccion, la renovacion
    # falla y el certificado vence sin que nadie se entere.
    include /etc/nginx/snippets/acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name tinker.onda.study;

    ssl_certificate         /etc/letsencrypt/live/tinker.onda.study/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/tinker.onda.study/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/tinker.onda.study/chain.pem;

    include /etc/nginx/snippets/seguridad.conf;
    include /etc/nginx/snippets/authelia-location.conf;

    access_log /var/log/nginx/tinker.access.log detallado;
    error_log  /var/log/nginx/tinker.error.log warn;

    # Con resolver y variable, y NO con el nombre literal: asi Nginx resuelve
    # en cada pedido. Con el nombre literal, si este contenedor esta caido el
    # proxy ENTERO no arranca y se caen todos los sitios.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # LA CSP NO VA A NIVEL DE server: un `add_header` dentro de un `location`
    # DESCARTA todos los heredados, y la cabecera desaparece sin ningun error.
    # Va repetida en cada location, y CON ELLA el snippet de seguridad: el
    # primer add_header de un location tira tambien el HSTS, el nosniff y el
    # X-Frame-Options que venian del server. Se comprobo el 2026-09-12 -- este
    # host salio sin HSTS hasta que se agrego el include a cada bloque.
    #
    #   · i.scdn.co — las portadas de Spotify.
    #   · cdn-images.dzcdn.net — las de Deezer, que es de donde salen las
    #     caratulas del buscador de grupos y del repertorio importado. Se
    #     agrego el 2026-09-12: sin el dominio, la CSP bloquea la imagen y la
    #     tarjeta queda sin caratula sin que nada lo explique.
    #   · connect-src incluye wss: el canal en vivo del mismo origen.
    #   · NO hace falta 'unsafe-inline': ni una linea de estilo ni de script
    #     vive dentro del HTML, justamente para poder escribir esto asi.
    set $csp "default-src 'self'; img-src 'self' data: https://i.scdn.co https://cdn-images.dzcdn.net https://e-cdns-images.dzcdn.net; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' wss://tinker.onda.study; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";

    # Salud, SIN sesion. Dice si el proceso y su base responden, y devuelve
    # 503 si no. Por "=" para que no se lo coma ningun prefijo.
    location = /health {
        access_log off;
        set $destino tinker_web;
        proxy_pass http://$destino:8000/health;
        include /etc/nginx/snippets/proxy.conf;
    }

    # EL CALLBACK DE OAUTH ES PUBLICO, y tiene que serlo. Spotify redirige el
    # navegador de la persona hasta acá; si esta ruta pidiera sesion de
    # Authelia, el codigo de autorizacion se perderia y la conexion no se
    # completaria nunca -- paso de verdad. Lo que la protege es el `state` que
    # emite el propio servidor: de un solo uso y con vencimiento.
    #
    # El `location =` exacto gana sobre el `^~ /api/admin/` de abajo, que es la
    # unica forma de abrir UNA ruta de un prefijo cerrado.
    location = /api/admin/spotify/callback {
        limit_req zone=general burst=10 nodelay;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/seguridad.conf;
        set $destino tinker_web;
        proxy_pass http://$destino:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ─────────────────── administracion: lo unico cerrado ───────────────────

    # La API de administracion. 401 JSON y no un 302: fetch() sigue las
    # redirecciones y recibiria el HTML del portal donde espera JSON.
    location ^~ /api/admin/ {
        limit_req zone=general burst=20 nodelay;
        include /etc/nginx/snippets/authelia-authrequest-api.conf;

        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/seguridad.conf;
        set $destino tinker_web;
        proxy_pass http://$destino:8000;
        include /etc/nginx/snippets/proxy.conf;

        error_page 401 = @sin_sesion;
    }

    # El tablero. Navegacion: sin sesion, al portal y de vuelta.
    location = /admin {
        limit_req zone=general burst=20 nodelay;
        include /etc/nginx/snippets/authelia-authrequest.conf;

        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/seguridad.conf;
        set $destino tinker_web;
        proxy_pass http://$destino:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location @sin_sesion {
        default_type application/json;
        return 401 '{"error":"sin_sesion","portal":"https://auth.onda.study/"}';
    }

    # ───────────────────────── lo publico ─────────────────────────

    # La API de los telefonos. La zona `fiesta` y no `general` por una razon
    # concreta: en un salon, TODOS los telefonos salen por la misma IP --el
    # wifi del lugar, o el NAT de la operadora. Con el cupo normal de 10r/s
    # por IP, la decima persona que escribe en el buscador al mismo tiempo
    # recibe 503 y cree que la aplicacion no anda. La unidad de cupo aca no es
    # una persona: es un salon entero.
    location ^~ /api/ {
        limit_req zone=fiesta burst=120 nodelay;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/seguridad.conf;
        set $destino tinker_web;
        proxy_pass http://$destino:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # El canal en vivo, uno por evento: /ws/<slug>. Abierto, como el resto.
    #
    # El read_timeout largo es lo que evita el modo de falla peor de todos:
    # con los 60s de proxy.conf, Nginx corta el socket cada minuto y el
    # televisor del salon se congela sin que nada explique por que. El latido
    # del servidor cada 25s ya lo mantiene vivo; esto es el cinturon.
    location ^~ /ws/ {
        set $destino tinker_web;
        proxy_pass http://$destino:8000;

        # NO se incluye proxy.conf: ese snippet fija proxy_read_timeout en 60s
        # y Nginx no admite la directiva dos veces en el mismo bloque.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    1h;
        proxy_send_timeout    1h;
    }

    # CSS y JS. Cupo alto por el mismo motivo que la API: doscientas personas
    # escaneando el QR a la vez piden todas los mismos cuatro archivos.
    location ^~ /estaticos/ {
        limit_req zone=fiesta burst=200 nodelay;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=300" always;
        set $destino tinker_web;
        proxy_pass http://$destino:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Las paginas: la portada, /<evento> y /<evento>/pantalla.
    location / {
        limit_req zone=fiesta burst=120 nodelay;
        add_header Content-Security-Policy $csp always;
        include /etc/nginx/snippets/seguridad.conf;
        set $destino tinker_web;
        proxy_pass http://$destino:8000;
        include /etc/nginx/snippets/proxy.conf;
    }
}
