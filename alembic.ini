# La URL NO va aca: la arma env.py desde el entorno, que es donde vive la clave.
[alembic]
script_location = migraciones
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARN
handlers = consola
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = simple

[formatter_simple]
format = %(levelname)-5.5s [%(name)s] %(message)s
